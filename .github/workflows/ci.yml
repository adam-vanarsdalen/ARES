name: ARES CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ARES_server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            ARES_server/requirements*.txt
            ARES_server/constraints.txt

      - name: Install deps
        run: |
          python -m pip install -r requirements.txt -c constraints.txt
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        env:
          ARES_API_KEY: ci-test-key
          ARES_ENV: dev
          ARES_DB_PATH: ":memory:"
          ARES_SAFE_TARGETS: "testphp.vulnweb.com,demo.testfire.net"
        run: python -m pytest tests/ -q

      - name: Lint check (basic)
        run: |
          python -m py_compile \
            server.py pipeline.py ollama_compat.py \
            tools/network_tools.py tools/js_intelligence.py \
            utils/config.py utils/auth.py utils/session_store.py utils/rate_limit.py
